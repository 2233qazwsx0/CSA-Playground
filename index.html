<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f4ef">
<meta name="description" content="CSA — Luau Obfuscator. Runs locally in your browser.">
<title>CSA · Luau Obfuscator</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --panel-2:#fbfaf6;
  --ink:#1c1917; --muted:#7a736a; --faint:#a8a196;
  --line:#e5dfd3; --line-2:#d8d0c0;
  --accent:#b45309; --accent-hover:#92400e; --accent-soft:#fdf0e0;
  --ok:#166534; --err:#b91c1c; --busy:#b45309;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Times New Roman","Songti SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh}
button{font-family:inherit;cursor:pointer}
textarea{font-family:var(--mono)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}

/* ── header ── */
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:28px 0 14px;border-bottom:3px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.5px}
.brand .tag{color:var(--muted);font-size:13px}
.head-right{display:flex;align-items:center;gap:14px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.err{background:var(--err)} .dot.busy{background:var(--busy);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
#status-label{color:var(--muted)}
.lang-btn{background:none;border:1px solid var(--line-2);border-radius:4px;padding:3px 10px;font-size:12px;color:var(--muted)}
.lang-btn:hover{border-color:var(--ink);color:var(--ink)}

/* ── editors ── */
.editors{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media(max-width:820px){.editors{grid-template-columns:1fr}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:12px;color:var(--muted)}
.pane-head b{color:var(--ink);font-weight:600}
.pane-head .count{font-family:var(--mono);font-size:11px;color:var(--faint)}
.pane textarea{flex:1;min-height:420px;border:0;resize:none;outline:none;padding:14px;background:transparent;color:var(--ink);font-size:12.5px;line-height:1.6;tab-size:2}
.pane textarea[readonly]{background:var(--panel-2)}
.pane textarea::placeholder{color:var(--faint)}
.pane.placeholder textarea{background:repeating-linear-gradient(0deg,transparent,transparent 19px,var(--line) 19px,var(--line) 20px),var(--panel-2)}

/* ── controls ── */
.controls{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.tier{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.tier button{border:0;background:var(--panel);padding:8px 16px;font-size:13px;color:var(--muted)}
.tier button+button{border-left:1px solid var(--line-2)}
.tier button.active{background:var(--ink);color:#fff}
select{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink)}
.actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:6px;padding:8px 18px;font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}

/* ── stats ── */
.stats{margin-top:16px;display:none;flex-wrap:wrap;gap:10px}
.stats.show{display:flex}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--mono);font-size:16px;color:var(--ink);font-weight:600}

/* ── footer ── */
footer{margin-top:36px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:6px 24px;font-size:12.5px;color:var(--muted)}
footer a{color:var(--accent)}
.note{color:var(--faint);font-size:12px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <h1>CSA</h1>
    <span class="tag" data-i18n="tagline">Luau 混淆器 · 浏览器本地运行</span>
  </div>
  <div class="head-right">
    <span class="dot" id="dot"></span><span id="status-label" data-i18n="loading">引擎加载中…</span>
    <button class="lang-btn" id="lang-btn" type="button">EN</button>
  </div>
</header>

<main>
  <div class="editors">
    <section class="pane" id="pane-in">
      <div class="pane-head"><b data-i18n="input">输入</b><span class="count" id="in-count">0 字符</span></div>
      <textarea id="in" spellcheck="false" placeholder="-- 在此粘贴 Luau 源码…" data-i18n-ph="input_ph"></textarea>
    </section>
    <section class="pane" id="pane-out">
      <div class="pane-head"><b data-i18n="output">输出</b><span class="count" id="out-count">0 字符</span></div>
      <textarea id="out" readonly spellcheck="false" placeholder="—" data-i18n-ph="output_ph"></textarea>
    </section>
  </div>

  <div class="controls">
    <div class="tier" id="tier" role="group" aria-label="tier">
      <button type="button" data-tier="lite" data-i18n="lite">lite</button>
      <button type="button" data-tier="standard" data-i18n="standard">standard</button>
      <button type="button" data-tier="max" class="active" data-i18n="max">max</button>
    </div>
    <select id="theme" aria-label="theme" title="变量名主题">
      <option value="random" selected data-i18n="theme_random">随机主题</option>
      <option value="arknights" data-i18n="theme_ak">明日方舟</option>
      <option value="zenless" data-i18n="theme_zz">绝区零</option>
      <option value="genshin" data-i18n="theme_gi">原神</option>
      <option value="starrail" data-i18n="theme_sr">星穹铁道</option>
      <option value="wuthering" data-i18n="theme_ww">鸣潮</option>
      <option value="endfield" data-i18n="theme_ef">终末地</option>
      <option value="confusion" data-i18n="theme_cf">混淆字符</option>
    </select>
    <div class="actions">
      <button class="btn" id="upload" type="button" data-i18n="upload">打开文件</button>
      <input type="file" id="file" accept=".lua,.luau,.txt" hidden>
      <button class="btn primary" id="obf" type="button" disabled data-i18n="obfuscate">混淆</button>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><span data-i18n="tier_l">等级</span><b id="stat-tier">—</b></div>
    <div class="stat"><span data-i18n="size">大小</span><b id="stat-size">—</b></div>
    <div class="stat"><span data-i18n="ratio">膨胀率</span><b id="stat-ratio">—</b></div>
    <div class="stat"><span data-i18n="time">耗时</span><b id="stat-time">—</b></div>
    <div class="actions" style="margin-left:auto;align-self:center">
      <button class="btn" id="copy" type="button" data-i18n="copy">复制</button>
      <button class="btn" id="dl" type="button" disabled data-i18n="download">下载 .lua</button>
    </div>
  </div>
</main>

<footer>
  <span data-i18n="local">无服务器 — 混淆由 WebAssembly 在本机浏览器完成</span>
  <span><span data-i18n="total_obf">总混淆</span>: <b id="total-obf">–</b> · <span data-i18n="total_dl">下载</span>: <b id="total-dl">–</b></span>
  <span class="note" id="ver"></span>
</footer>

</div>

<script src="./wasm_exec.js"></script>
<script>
'use strict';
const API = 'https://api.csa.cua123.ccwu.cc';
const $ = s => document.querySelector(s);

/* ── i18n (minimal) ── */
const STR = {
  zh: {
    tagline:'Luau 混淆器 · 浏览器本地运行', loading:'引擎加载中…', ready:'就绪', obfuscating:'混淆中…', done:'完成', error:'出错',
    input:'输入', output:'输出', input_ph:'-- 在此粘贴 Luau 源码…', output_ph:'—',
    lite:'lite', standard:'standard', max:'max',
    theme_random:'随机主题', theme_ak:'明日方舟', theme_zz:'绝区零', theme_gi:'原神', theme_sr:'星穹铁道', theme_ww:'鸣潮', theme_ef:'终末地', theme_cf:'混淆字符',
    upload:'打开文件', obfuscate:'混淆', copy:'复制', copied:'已复制 ✓', download:'下载 .lua',
    tier_l:'等级', size:'大小', ratio:'膨胀率', time:'耗时',
    local:'无服务器 — 混淆由 WebAssembly 在本机浏览器完成',
    total_obf:'总混淆', total_dl:'下载',
    no_input:'请先输入代码', wait:'引擎尚未就绪',
    load_failed:'WASM 加载失败:', chars:'字符', lines:'行',
  },
  en: {
    tagline:'Luau Obfuscator · runs in your browser', loading:'Loading engine…', ready:'Ready', obfuscating:'Obfuscating…', done:'Done', error:'Error',
    input:'Input', output:'Output', input_ph:'-- paste Luau source here…', output_ph:'—',
    lite:'lite', standard:'standard', max:'max',
    theme_random:'Random', theme_ak:'Arknights', theme_zz:'Zenless', theme_gi:'Genshin', theme_sr:'Star Rail', theme_ww:'Wuthering', theme_ef:'Endfield', theme_cf:'Confusion',
    upload:'Open file', obfuscate:'Obfuscate', copy:'Copy', copied:'Copied ✓', download:'Download .lua',
    tier_l:'Tier', size:'Size', ratio:'Ratio', time:'Time',
    local:'No server — obfuscation runs locally via WebAssembly',
    total_obf:'Obfuscations', total_dl:'Downloads',
    no_input:'Please enter some code', wait:'Engine not ready yet',
    load_failed:'WASM load failed:', chars:'chars', lines:'lines',
  }
};
let lang = 'zh';
function t(k){ return (STR[lang] && STR[lang][k]) || k; }
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $('#lang-btn').textContent = lang === 'zh' ? 'EN' : '中文';
  updateCounts();
}
$('#lang-btn').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; applyLang(); });

/* ── state ── */
const go = new Go();
let ready = false;
let curTier = 'max';
let curTheme = 'random';

function setStatus(state, text){
  $('#dot').className = 'dot' + (state ? ' ' + state : '');
  if (text !== undefined) $('#status-label').textContent = text;
}
function fmtBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(2) + ' MB';
}
function updateCounts(){
  const lines = v => { const n = v.split('\n').length; return n + ' ' + t('lines') + ' · ' + v.length + ' ' + t('chars'); };
  $('#in-count').textContent = lines($('#in').value);
  $('#out-count').textContent = lines($('#out').value);
}

/* ── wasm bootstrap: never await go.run() — Go main() blocks forever; poll for the export ── */
function pollReady(){
  if (typeof csaObfuscate === 'function'){
    ready = true;
    $('#obf').disabled = false;
    setStatus('ok', t('ready'));
    return;
  }
  setTimeout(pollReady, 100);
}
function boot(bytes){
  return WebAssembly.instantiate(bytes, go.importObject)
    .then(r => { go.run(r.instance); pollReady(); });
}
WebAssembly.instantiateStreaming(fetch('./csa.wasm'), go.importObject)
  .then(r => { go.run(r.instance); pollReady(); })
  .catch(() => fetch('./csa.wasm').then(r => r.arrayBuffer()).then(boot))
  .catch(e => setStatus('err', t('load_failed') + ' ' + e));

/* ── controls ── */
$('#tier').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  curTier = b.dataset.tier;
  document.querySelectorAll('#tier button').forEach(x => x.classList.toggle('active', x === b));
});
$('#theme').addEventListener('change', e => { curTheme = e.target.value; });
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { $('#in').value = rd.result; updateCounts(); };
  rd.readAsText(f);
  e.target.value = '';
});
$('#upload').addEventListener('click', () => $('#file').click());

function obfuscate(){
  const src = $('#in').value;
  if (!src.trim()) { setStatus('err', t('no_input')); return; }
  if (!ready) { setStatus('err', t('wait')); return; }
  $('#obf').disabled = true;
  setStatus('busy', t('obfuscating'));
  setTimeout(() => {
    try {
      const out = csaObfuscate(src, curTier, curTheme);
      if (out && out.error) { setStatus('err', out.error); $('#obf').disabled = false; return; }
      $('#out').value = out.result;
      $('#stat-tier').textContent = out.tier;
      $('#stat-size').textContent = fmtBytes(out.outputBytes);
      $('#stat-ratio').textContent = (out.outputBytes / Math.max(1, out.inputBytes)).toFixed(1) + '×';
      $('#stat-time').textContent = out.durationMs + ' ms';
      $('#stats').classList.add('show');
      $('#dl').disabled = false;
      setStatus('ok', t('done'));
      updateCounts();
      try { fetch(API + '/stats', { method: 'POST' }); } catch (e) {}
    } catch (e) { setStatus('err', String(e)); }
    $('#obf').disabled = false;
  }, 30);
}
$('#obf').addEventListener('click', obfuscate);

$('#copy').addEventListener('click', async () => {
  const v = $('#out').value; if (!v) return;
  try { await navigator.clipboard.writeText(v); }
  catch (e) { const ta = $('#out'); ta.select(); document.execCommand('copy'); }
  const b = $('#copy'); b.textContent = t('copied');
  setTimeout(() => { b.textContent = t('copy'); }, 1500);
});
$('#dl').addEventListener('click', () => {
  const v = $('#out').value; if (!v) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([v], { type: 'text/plain' }));
  a.download = 'obfuscated.lua';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  try { fetch(API + '/download', { method: 'POST' }); } catch (e) {}
});

/* ── stats from API ── */
fetch(API + '/stats').then(r => r.json()).then(d => {
  if (d.obfuscations !== undefined) $('#total-obf').textContent = d.obfuscations;
  if (d.downloads !== undefined) $('#total-dl').textContent = d.downloads;
}).catch(() => {});

/* ── init ── */
$('#in').addEventListener('input', updateCounts);
$('#out').addEventListener('input', updateCounts);
applyLang();
updateCounts();
setStatus('', t('loading'));
</script>
</body>
</html>
